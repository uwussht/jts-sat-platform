name: Build and publish site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t jts-sat:ci .
      - name: Check site over HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sat-check jts-sat:ci
          trap 'docker logs sat-check; docker rm -f sat-check' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec sat-check wget -q -O /dev/null http://127.0.0.1/; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          for path in js/core.js css/core.css js/data/questions/index.json js/data/lessons/index.json js/data/papers/index.json; do
            docker exec sat-check wget -q -O /dev/null "http://127.0.0.1/$path"
          done
      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GH_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker tag jts-sat:ci "$image:sha-$COMMIT_SHA"
          docker tag jts-sat:ci "$image:latest"
          docker push "$image:sha-$COMMIT_SHA"
          docker push "$image:latest"
