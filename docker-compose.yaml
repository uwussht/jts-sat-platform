# Local: the site, the API and its database.
#   docker compose up -d --build      then open http://localhost:8080
# Secrets come from .env (copy .env.example to .env and fill it in).
# Production is docker-compose.prod.yaml (the static site image, deployed by
# .github/workflows/site.yml).
name: jts-sat

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teentech
      POSTGRES_USER: teentech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teentech -d teentech"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://teentech:${POSTGRES_PASSWORD}@db:5432/teentech
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Phones that become admins on sign-up or sign-in (comma-separated).
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      # Packages a new student starts with until a manager changes them.
      DEFAULT_PACKAGES: ${DEFAULT_PACKAGES:-basic}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db-data:
